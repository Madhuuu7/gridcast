[project]
name = "gridcast"
version = "0.1.0"
description = "Day-ahead load forecasting for the Delhi grid, with prediction intervals whose coverage is measured rather than assumed"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.8",
    "scikit-learn>=1.5",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
