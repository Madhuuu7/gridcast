# Declare tomorrow's schedule, every day, without anyone's laptop being on.
#
# This is the answer to "who fixes the value". Nobody does: the model fixes
# it at the gate and the store refuses to let it be edited afterwards. What
# this file adds is the only missing piece -- something that actually runs
# at the gate. Before it existed the daily job had to be invoked by hand,
# which meant the record had a gap whenever nobody remembered.
#
# It runs on GitHub's servers, free and unlimited for a public repository.
#
# The one secret it needs is DATABASE_URL, pointing at the same Postgres the
# deployed service reads. Without it the job would write to a SQLite file on
# an ephemeral runner and the forecast would vanish with the container, so
# the workflow checks for it and stops with a readable message instead.

name: daily forecast

on:
  schedule:
    # 04:45 UTC is 10:15 IST -- a quarter hour after the scheduling gate,
    # which is when a real scheduler has published and the forecast becomes
    # a claim rather than a draft. GitHub's cron is best-effort and can run
    # late under load; the store rejects anything that slips past midnight
    # IST, so a very late run leaves an honest gap rather than a backdated
    # row.
    - cron: "45 4 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Target date (YYYY-MM-DD). Defaults to tomorrow IST."
        required: false
      reissue:
        description: "Publish a second run for a day that already has one"
        type: boolean
        default: false

concurrency:
  # Two issuances racing for the same day would both be refused by the
  # store, but the fetch would still hammer a government website twice.
  group: daily-forecast
  cancel-in-progress: false

jobs:
  issue:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Restore the SLDC cache
        # One CSV per day, about 45 MB for three years. Restoring it means a
        # daily run fetches the handful of days it is missing instead of
        # re-pulling three years from a public government server every
        # morning. The key rolls monthly so the cache cannot grow forever.
        uses: actions/cache@v6
        with:
          path: data/raw
          key: sldc-${{ github.run_id }}
          restore-keys: |
            sldc-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Is there a database to write to?
        # A warning and a clean stop, not a failure. Without somewhere
        # durable to write, the forecast would go to a container that is
        # about to be destroyed, so there is nothing useful to do -- but a
        # job that fails every morning for a reason nobody is going to fix
        # today teaches you to ignore the one morning it fails for a
        # different reason. The moment DATABASE_URL exists this resumes on
        # its own, with no edit here.
        id: database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL is not set, so no schedule was"
            echo "::warning::issued today and the ledger has a gap for it."
            echo "::warning::Add it as a repository secret pointing at a"
            echo "::warning::Postgres and the next run writes again."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Top up the load archive
        if: steps.database.outputs.ready == 'true'
        # Eighteen months is enough to fit and calibrate. A cold cache pays
        # for this once; after that it fetches only the new days.
        run: python scripts/fetch_data.py --years 1.5 --workers 3

      - name: Migrate
        if: steps.database.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head

      - name: Record what the grid actually drew
        if: steps.database.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/issue_forecast.py --observe

      - name: Declare tomorrow
        if: steps.database.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/issue_forecast.py \
            ${{ inputs.target && format('--target {0}', inputs.target) || '' }} \
            ${{ inputs.reissue && '--reissue' || '' }}

      - name: Show the record
        if: always() && steps.database.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/issue_forecast.py --scorecard
